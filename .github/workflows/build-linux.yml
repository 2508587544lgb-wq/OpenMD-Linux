name: build-linux

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libfuse2t64

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Checkout upstream source
        run: |
          curl -L -o openmd.tar.gz \
            https://codeload.github.com/MuLiuSaMa/OpenMD/tar.gz/refs/heads/main
          echo "c34cc68139811982c3cab834b88fe63c7e00a7d17f6c082ff13ab0236498dd93  openmd.tar.gz" | sha256sum -c -
          mkdir upstream && tar xzf openmd.tar.gz -C upstream --strip-components=1
          patch -d upstream -p1 < patches/0001-pin-clipboard-plugin-to-2.4.1.patch

      - name: Build frontend
        working-directory: upstream
        run: |
          npm install --no-audit --no-fund
          npx vite build

      - name: Build bundles
        working-directory: upstream
        run: |
          cat > /tmp/tauri-override.json <<'EOF'
          { "build": { "beforeBuildCommand": "" } }
          EOF
          npx tauri build --config /tmp/tauri-override.json

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp upstream/src-tauri/target/release/bundle/deb/*.deb out/ || true
          cp upstream/src-tauri/target/release/bundle/appimage/*.AppImage out/ || true
          cd out && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: openmd-linux
          path: out/*

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
